name: Build Docker Nightly image

on:
  push:
    branches:
      - 'dev'
  workflow-dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4
      
      - name: Install Prerequisites
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DEFAULT_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          docker build --platform linux/amd64,linux/arm64 --build-arg BUILD_IDENTIFIER=${SHORT_HASH:0:5} -t ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5} .

          # Tag the same image as "latest"
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5} ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5} ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest

      - name: Push Docker Images
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest

      - name: Log out from registry
        if: always()
        run: docker logout ${{ vars.DEFAULT_REGISTRY }}

      - name: Cleanup compiled images
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          docker image rm ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}
          docker image rm ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}
          docker image rm ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest