name: Build Docker Release image

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4
      
      - name: Install Prerequisites
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        env:
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          docker build --platform linux/amd64,linux/arm64 --build-arg BUILD_IDENTIFIER=${SHORT_HASH:0:5} -t vichingo455/orario:${{ gitea.event.release.tag_name }} .

          # Tag the same image as "latest"
          docker tag vichingo455/orario:${{ gitea.event.release.tag_name }} vichingo455/orario:stable
          docker tag vichingo455/orario:${{ gitea.event.release.tag_name }} vichingo455/orario:latest

      - name: Push Docker Images
        run: |
          docker push vichingo455/orario:${{ gitea.event.release.tag_name }}
          docker push vichingo455/orario:stable
          docker push vichingo455/orario:latest

      - name: Log out from registry
        if: always()
        run: docker logout

      - name: Cleanup compiled images
        run: |
          docker image rm vichingo455/orario:${{ gitea.event.release.tag_name }}
          docker image rm vichingo455/orario:stable
          docker image rm vichingo455/orario:latest