name: Build Docker Nightly image

on:
  push:
    branches:
      - 'dev'
  workflow-dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4
      
      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DEFAULT_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          docker build --build-arg BUILD_IDENTIFIER=${SHORT_HASH:0:5} -t ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64 .

          # Tag the same image as "latest"
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64 ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-amd64
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64 ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-amd64

      - name: Push Docker Images
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-amd64
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-amd64

      - name: Log out from registry
        if: always()
        run: docker logout ${{ vars.DEFAULT_REGISTRY }}
  build-arm64:
    needs: build-amd64
    runs-on: ubuntu-latest-arm64
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4
      
      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DEFAULT_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          docker build --build-arg BUILD_IDENTIFIER=${SHORT_HASH:0:5} -t ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64 .

          # Tag the same image as "latest"
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64 ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-arm64
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64 ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-arm64

      - name: Push Docker Images
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-arm64
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-arm64
      
      - name: Create and Push Image Manifest
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # --- Defines ---
          # 1. Version Tag (e.g., dev-a1b2c)
          VERSION_TAG="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}"
          VERSION_AMD="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64"
          VERSION_ARM="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64"

          # 2. Branch Tag (e.g., dev)
          BRANCH_TAG="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}"
          BRANCH_AMD="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-amd64"
          BRANCH_ARM="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-arm64"

          # 3. Latest Tag (e.g., latest)
          LATEST_TAG="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest"
          LATEST_AMD="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-amd64"
          LATEST_ARM="${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-arm64"

          # --- Execution ---

          # Create/Push Manifest for Version
          docker manifest create $VERSION_TAG --amend $VERSION_AMD --amend $VERSION_ARM
          docker manifest push --purge $VERSION_TAG

          # Create/Push Manifest for Branch (THIS WAS THE MISSING ONE)
          docker manifest create $BRANCH_TAG --amend $BRANCH_AMD --amend $BRANCH_ARM
          docker manifest push --purge $BRANCH_TAG

          # Create/Push Manifest for Latest
          docker manifest create $LATEST_TAG --amend $LATEST_AMD --amend $LATEST_ARM
          docker manifest push --purge $LATEST_TAG

      - name: Log out from registry
        if: always()
        run: docker logout ${{ vars.DEFAULT_REGISTRY }}