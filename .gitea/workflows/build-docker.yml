name: Build Docker Nightly image

on:
  push:
    branches:
      - 'dev'
  workflow-dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4
      
      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DEFAULT_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          docker build --build-arg BUILD_IDENTIFIER=${SHORT_HASH:0:5} -t ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64 .

          # Tag the same image as "latest"
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64 ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-amd64
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64 ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-amd64

      - name: Push Docker Images
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-amd64
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-amd64

      - name: Log out from registry
        if: always()
        run: docker logout ${{ vars.DEFAULT_REGISTRY }}
  build-arm64:
    runs-on: ubuntu-latest-arm64
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4
      
      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DEFAULT_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          docker build --build-arg BUILD_IDENTIFIER=${SHORT_HASH:0:5} -t ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64 .

          # Tag the same image as "latest"
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64 ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-arm64
          docker tag ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64 ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-arm64

      - name: Push Docker Images
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-arm64
          docker push ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-arm64
      
      - name: Create and Push Image Manifest
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          mkdir ~/.docker
          echo { "experimental": "enabled" } >> ~/.docker/config.json
          docker manifest create ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5} --amend ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-amd64 --amend ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}-arm64
          docker manifest push --purge ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-${SHORT_HASH:0:5}
          docker manifest create ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME} --amend ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-amd64 --amend ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}-arm64
          docker manifest push --purge ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:${BRANCH_NAME}
          docker manifest create ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest --amend ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-amd64 --amend ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest-arm64
          docker manifest push --purge ${{ vars.DEFAULT_REGISTRY }}/emmev-code/orario:latest

      - name: Log out from registry
        if: always()
        run: docker logout ${{ vars.DEFAULT_REGISTRY }}